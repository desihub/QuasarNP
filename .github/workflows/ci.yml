# Workflow is based on the Astropy GitHub actions workflow, ci_workflows.yml
name: CI

on:
    push:
        branches:
            - '*'
        tags:
            - '*'
    pull_request:

jobs:
    tests:
        name: Unit tests
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                include:
                    - os: ubuntu-latest
                      python-version: '3.13'
                      numpy-version: '<3'
                      astropy-version: '<8'
                    - os: ubuntu-latest
                      python-version: '3.12'
                      numpy-version: '<2.3'
                      astropy-version: '<7.1'
                    - os: ubuntu-latest
                      python-version: '3.11'
                      numpy-version: '<2.1'
                      astropy-version: '<7'
                    # Similar to NERSC but with last NumPy < 2.
                    - os: ubuntu-latest
                      python-version: '3.10'
                      numpy-version: '<2'
                      astropy-version: '<6.1'

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                python-version: ${{ matrix.python-version }}
            - name: Install Python dependencies
              run: |
                python -m pip install --upgrade pip wheel
                python -m pip install pytest
                pip install .
            - name: Test
              run: pytest

    coverage:
        name: Test coverage
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                include:
                    # Similar to NERSC but with last NumPy < 2.
                    - os: ubuntu-latest
                      python-version: '3.10'
                      numpy-version: '<2'
                      astropy-version: '<6.1'

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                python-version: ${{ matrix.python-version }}
            - name: Install Python dependencies
              run: |
                python -m pip install --upgrade pip wheel
                python -m pip install pytest coverage coveralls
                pip install .
            - name: Test
              run: coverage run -m pytest
            - name: Coveralls
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: coveralls --service=github

    docs:
        name: Doc test
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                python-version:
                    - '3.13'

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                python-version: ${{ matrix.python-version }}
            - name: Install Python dependencies
              run: |
                python -m pip install --upgrade pip setuptools wheel Sphinx
            - name: Test the documentation
              run: sphinx-build -W --keep-going -b html doc doc/_build/html

